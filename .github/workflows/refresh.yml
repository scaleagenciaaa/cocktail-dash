name: Refresh tráfego (3h)

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # a cada 15 min (24/11/2026: dash mudou p/ agenciaup13-max; o GitHub agenda sozinho, sem cron-job.org)
  workflow_dispatch:

permissions:
  contents: write

concurrency:   # nunca duas atualizacoes ao mesmo tempo (a de tras espera)
  group: refresh-trafego
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tudo (data.js + obj + insights)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Mode all
      - name: Commit se mudou
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git status --porcelain) {
            git commit -m ("auto: cloud " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git pull --rebase origin main
            git push
          } else { Write-Host "sem mudancas" }
